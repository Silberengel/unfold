# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
imports:
    - { resource: unfold.yaml }

parameters:
    footer_links: '%kernel.project_dir%/config/unfold.yaml'
    # Default when TRUSTED_PROXIES is unset (override in .env / Compose for real deployments).
    env(TRUSTED_PROXIES): '127.0.0.0/8,::1'

services:
    App\Service\HighlightAuthorMetadataProvider:
        alias: App\Service\CacheService

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Dto/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '%env(DATABASE_URL)%'
    App\Service\NostrRelayRequestFactory:
        arguments:
            $relayRequestTimeoutSec: '%nostr_relay_request_timeout_sec%'
    App\Service\NostrRelayFanoutTransport:
        arguments:
            $projectDir: '%kernel.project_dir%'
    App\Service\NostrRelayListFactory:
        arguments:
            $defaultRelayUrl: '%default_relay%'
            $articleRelayUrls: '%article_relays%'
            $profileRelayUrls: '%profile_relays%'
    App\Service\NostrClient:
        arguments:
            $projectDir: '%kernel.project_dir%'
    App\Service\ArticleCommentThreadLoader:
        arguments:
            $appCachePool: '@cache.replies'
    App\Twig\FooterLinksExtension:
        arguments:
            $footerLinksPath: '%footer_links%'
        tags: [ 'twig.extension' ]
    App\Twig\NostrShareMenuExtension:
        tags: [ 'twig.extension' ]
    App\Twig\MagazineJumbleExtension:
        tags: [ 'twig.extension' ]
    App\Twig\TopTopicsExtension:
        tags: [ 'twig.extension' ]
    App\Service\MagazineRefresher:
        arguments:
            $appCache: '@cache.app'
            $magazinePrewarmPreferSlugs: '%magazine_prewarm_prefer_slugs%'
            $magazinePrewarmAlsoSlugs: '%magazine_prewarm_also_slugs%'
    App\Controller\ArticleController:
        bind:
            $articlesCache: '@cache.drafts'
    App\Service\Nip05VerificationService:
        arguments:
            $appCache: '@cache.app'

when@test:
    services:
        Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
            class: Symfony\Component\HttpFoundation\Session\Storage\Handler\NativeFileSessionHandler
            arguments: ['%kernel.project_dir%/var/sessions_test']
